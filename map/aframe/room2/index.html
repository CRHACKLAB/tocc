    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >

                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>

        <button id="playPauseBtn"><i class="fa-solid fa-play"></i>/<i class="fa-solid fa-pause"></i></button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
    </div> -->
</div>
<!-- entrance link -->
    <!-- Link fisso in basso a destra -->
    <div id="entranceLink" 
        class="entranceLink"
        style="
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        z-index: 1000;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.4);
        padding: 1rem 2rem;
        border-radius: 8px;
        transition: all 0.3s ease;
    ">
        <a href="../entrance/index.html" style="
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-family: Helvetica, Arial, sans-serif;
            font-weight: bold;
        ">Visita la mostra</a>
