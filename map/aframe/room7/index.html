    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
</div>

<!-- entrance link -->
    <!-- Link fisso in basso a destra -->
    <div id="entranceLink" style="
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        z-index: 1000;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.4);
        padding: 1rem 2rem;
        border-radius: 8px;
        transition: all 0.3s ease;
    ">
        <a href="../entrance/index.html" style="
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-family: Helvetica, Arial, sans-serif;
            font-weight: bold;
        ">Visita la mostra</a>
    </div>

    <style>
        #entranceLink:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }
    </style>
