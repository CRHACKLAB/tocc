<html>
<head>
    <meta charset="utf-8">
    <title>Smascherati! - Mostra Virtuale</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Montefalco Palazzo Comune Piazza" name="keywords">
    <meta content="Palazzo del Comune e Piazza" name="description">
    <script src="../dist/aframe-min.js"></script>
    <script src="../dist/look-at.js"></script>
    <script src="../assets/scripts/components.js"></script>
    <script src="../assets/scripts/main.js"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    
</head>
<body>
    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
</div>
<!-- A-Frame Scene -->
<a-scene cursor="rayOrigin: mouse;" raycaster="objects: .interactable" inspector>
    <!-- Assets -->
    <a-assets>
        <img id="sky" src="R0010200.jpg">
        <img id="room1" src="../room1/R0010191.jpg">
        <img id="room6" src="../room6/R0010199.jpg">
        <img id="room4" src="../room4/R0010196.jpg" >
        <!-- strange fruit -->
        <img id="strangeFruit" src="../assets/images/03_1997_strangeFruit.jpg">
        <video id="strangeFruitVideo" src="../../../toccSma/Carriola Strange Fruit.mp4" preload="auto" loop></video>
        <!-- il cielo è muto -->
        <img id="cieloMuto" src="../assets/images/33_2024_ilCieloMuto.jpg">
        <video id="cieloMutoVideo" src="../../../toccSma/Coperte Il Cielo È Muto.mp4" preload="auto" loop></video>
        <!-- dry -->
        <img id="dry" src="../assets/images/14_2007_dry.jpg">
        <video id="dryVideo" src="../../../toccSma/Wc Dry.mp4" preload="auto" loop></video>
        <!-- spifferi -->
        <img id="spifferi" src="../assets/images/20_2012_spifferi.jpg">
        <video id="spifferiVideo" src="../../../toccSma/Finestrella Spifferi.mp4" preload="auto" loop></video>
    </a-assets>
    <!-- Portals and hotspots -->
    <a-entity id="hotspots">
        <!-- Portals -->
        <a-link class="interactable" href="../room4/index.html" title="Prosegui" image="#room4" position="-8.786 0.074 2.035" rotation="0 -91.931 0" scale="0.80887 0.80887 0.80887"  link="backgroundColor: #d7f8fe" geometry="primitive: circle" material="backgroundColor: #bc8f8f"></a-link>
        <a-link class="interactable" href="../room1/index.html" title="Prosegui" image="#room1" position="7.55467 2.05776 -6.40502" rotation="3.1042853340188 -53.127 0.11688339020668795" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle" material="backgroundColor: #bc8f8f"></a-link>
        <a-link class="interactable" href="../room6/index.html" title="Prosegui" image="#room6"  position="-4.9033 0.90404 8.27398" rotation="3.942 -31.100 -3.011" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle" material="backgroundColor: #bc8f8f"></a-link>
        
        <!-- Info Panel-->
        <!-- <a-circle id="F492AP01S01S00" class="interactable" src="#infopanel" radius="0.1" position="-2.5 3 -3" look-at="#cam" show-info="href: info/index.html"></a-circle> -->
        <!-- Hotspots --> 
        <a-circle id="strangeFruiteBtn" class="interactable" src="#strangeFruit" radius="0.4" position="5.25473 0.05256 5.6205" look-at="#cam" video-overlay="src: #strangeFruitVideo" material="" geometry="" rotation="-9.619814296686434 -139.9812181616726 -8.064791336794753e-16">
            <a-text value="Strange Fruit" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="dryBtn" class="interactable" src="#dry" radius="0.4" position="2.46948 0.75364 -0.75705" look-at="#cam" video-overlay="src: #dryVideo" material="" geometry="">
            <a-text value="Dry" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="cieloMutoBtn" class="interactable" src="#cieloMuto" radius="0.4" position="7.70968 0.19244 3.99944" look-at="#cam" video-overlay="src: #cieloMutoVideo" material="" geometry="">
            <a-text value="Il Cielo è Muto" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="spifferiBtn" class="interactable" src="#spifferi" radius="0.4" position="-2.85668 1.77942 -5.7623" look-at="#cam" video-overlay="src: #spifferiVideo" material="" geometry="">
            <a-text value="Spifferi" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
    </a-entity>
    <!-- Camera and sky -->
    <a-camera id="cam"  wasd-controls="enabled: true" look-controls cursor="rayOrigin: mouse;" raycaster="objects: .interactable; far: 20">
    </a-camera>
    <a-sky id="skybox" src="#sky" rotation="0 -90 0"></a-sky>
</a-scene>
</body>
</html>
