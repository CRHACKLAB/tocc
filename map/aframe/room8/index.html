<html>
<head>
    <meta charset="utf-8">
    <title>Smascherati! - Mostra Virtuale</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Montefalco Palazzo Comune Piazza" name="keywords">
    <meta content="Palazzo del Comune e Piazza" name="description">
    <script src="../dist/aframe-min.js"></script>
    <script src="../dist/look-at.js"></script>
    <script src="../assets/scripts/components.js"></script>
    <script src="../assets/scripts/main.js"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    
</head>
<body>
    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
    
    <!-- <div>
        <button id="playPauseBtn"><i class="fa-solid fa-play"></i>/<i class="fa-solid fa-pause"></i></button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
    </div> -->
</div>
<!-- A-Frame Scene -->
<a-scene cursor="rayOrigin: mouse;" raycaster="objects: .interactive" inspector>
    <!-- Assets -->
    <a-assets>
        <img id="sky" src="R0010202.jpg">
        <img id="linkpreview01" src="../S02/F492AP01S02.jpg">
        <img id="room5" src="../room5/R0010197.jpg">
        <img id="room7" src="../room7/R0010200.jpg">
        <!-- end bag -->
        <img id="endBag" src="../assets/images/24_2016_senzaDove.jpg">
        <video id="endBagVideo" src="/toccSma/Valigie End Bag.mp4" preload="auto" loop></video>
        <!-- papiers -->
        <img id="papier" src="../assets/images/15_2007_papiers.jpg">
        <video id="papierVideo" src="/toccSma/Bancale Papier.mp4" preload="auto" loop></video>
        <!-- dal gorgo -->
        <img id="dalGorgo" src="../assets/images/07_2001_dalGorgo.jpg">
        <video id="dalGorgoVideo" src="/toccSma/Acquario Dal Gorgo.mp4" preload="auto" loop></video>
        <!-- spifferi -->
        <img id="spifferi" src="../assets/images/20_2012_spifferi.jpg">
        <video id="spifferiVideo" src="/toccSma/Finestrella Spifferi.mp4" preload="auto" loop></video>
        <!-- strange fruit -->
        <img id="strangeFruit" src="../assets/images/03_1997_strangeFruit.jpg">
        <video id="strangeFruitVideo" src="/toccSma/Carriola Strange Fruit.mp4" preload="auto" loop></video>
    </a-assets>
    <!-- Portals and hotspots -->
    <a-entity id="hotspots">
        <!-- Portals -->
        <a-circle class="interactable" 
            portal-link="href: ../room5/index.html"
            position="7.17426 1.98596 0.0888" 
            rotation="3.1042853340188 -68.03816521399013 90" 
            scale="0.80887 0.80887 0.80887" 
            radius="1"
            material="color: #ffffff; transparent: true; opacity: 0.2; shader: flat; side: double">
            
            <!-- Freccia costruita con forme geometriche -->
            <!-- Asta della freccia -->
            <a-box width="0.6" 
                height="0.1" 
                depth="0.05" 
                color="white" 
                position="0 0 0.1">
            </a-box>
            
            <!-- Punta della freccia (triangolo) -->
            <a-cone radius-bottom="0.2" 
                radius-top="0" 
                height="0.3" 
                color="white" 
                rotation="0 0 -90" 
                position="0.4 0 0.1">
            </a-cone>

            <!-- Bordo del cerchio -->
            <a-ring color="white" 
                radius-inner="0.97" 
                radius-outer="1" 
                segments-theta="64" 
                material="side: double">
            </a-ring>
        </a-circle>

        <a-circle class="interactable" 
            portal-link="href: ../room7/index.html"
            position="4.52246 1.52202 3.96381" 
            rotation="2.4092875285251116 -127.77703676551027 90" 
            scale="0.80887 0.80887 0.80887" 
            radius="1"
            material="color: #ffffff; transparent: true; opacity: 0.2; shader: flat; side: double">
            
            <!-- Freccia costruita con forme geometriche -->
            <!-- Asta della freccia -->
            <a-box width="0.6" 
                height="0.1" 
                depth="0.05" 
                color="white" 
                position="0 0 0.1">
            </a-box>
            
            <!-- Punta della freccia (triangolo) -->
            <a-cone radius-bottom="0.2" 
                radius-top="0" 
                height="0.3" 
                color="white" 
                rotation="0 0 -90" 
                position="0.4 0 0.1">
            </a-cone>

            <!-- Bordo del cerchio -->
            <a-ring color="white" 
                radius-inner="0.97" 
                radius-outer="1" 
                segments-theta="64" 
                material="side: double">
            </a-ring>
        </a-circle>
        <!-- <a-link class="interactable" href="../room5/index.html" title="Prosegui" image="#room5" position="7.17426 1.98596 0.0888" rotation="3.1042853340188 -68.03816521399013 1.1069544601927506" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle; segments: 64" material="backgroundColor: #d7f8fe; shader: portal; side: double; pano: https://192.168.4.112:8801/aframe/room5/R0010197.jpg"><a-entity text="color: white; align: center; font: kelsonsans; value: Prosegui; width: 5" position="0 1.5 0" rotation=""></a-entity><a-entity geometry="primitive: sphere; segmentsWidth: 64; segmentsHeight: 64; phiLength: 180; thetaLength: 360" material="shader: portal; borderEnabled: 0; pano: [object HTMLImageElement]; side: back" rotation="0 180 0" position="" visible="false"></a-entity><a-entity geometry="primitive: sphere; radius: 10; segmentsWidth: 64; segmentsHeight: 64" material="shader: portal; borderEnabled: 0; pano: [object HTMLImageElement]; side: back" visible="false"></a-entity></a-link>
        <a-link class="interactable" href="../room7/index.html" title="Prosegui" image="#room7" position="4.52246 1.52202 3.96381" rotation="2.4092875285251116 -127.77703676551027 -0.3300236899953542" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle; segments: 64" material="backgroundColor: #d7f8fe; shader: portal; side: double; pano: http://127.0.0.1:5500/map/aframe/room7/R0010200.jpg"><a-entity text="color: white; align: center; font: kelsonsans; value: Prosegui; width: 5" position="0 1.5 0" rotation="-4.789927167293682 -3.9952347054472304 0.8267780983737779"></a-entity></a-link> -->
        
        <!-- Hotspots --> 
        <a-plane 
            id="endBagBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="0.70808 1.02276 -3.56424" 
            rotation="-9.02595800647699 -11.236215058670846 0" 
            video-overlay="src: #endBagVideo"
            material="color: #ffffff; transparent: true; opacity: 0.1; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 0.7; height: 0.2; radius: 0.05">
            <a-text value="End Bag" color="white" scale="0.35 0.35 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="papierBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="-1.38543 1.75737 -4.44127" 
            rotation="1.937346456414604 17.32502684694601 0" 
            video-overlay="src: #papierVideo"
            material="color: #ffffff; transparent: true; opacity: 0.1; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 0.7; height: 0.2; radius: 0.05">
            <a-text value="Papiers" color="white" scale="0.35 0.35 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="spifferiBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="2.71321 1.73641 5.15101" 
            look-at="#cam" 
            video-overlay="src: #spifferiVideo"
            material="color: #ffffff; transparent: true; opacity: 0.1; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 0.7; height: 0.2; radius: 0.05">
            <a-text value="Spifferi" color="white" scale="0.35 0.35 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="dalGorgo" 
            class="interactable" 
            width="0.8" 
            height="0.2" 
            position="0.92532 -0.51437 -3.2969" 
            look-at="#cam" 
            video-overlay="src: #dalGorgoVideo"
            material="color: #ffffff; transparent: true; opacity: 0.1; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 0.8; height: 0.2; radius: 0.05">
            <a-text value="Dal Gorgo" color="white" scale="0.35 0.35 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="strangeFruitBtn" 
            class="interactable" 
            width="0.9" 
            height="0.2" 
            position="5.17755 1.02035 -1.43261" 
            look-at="#cam" 
            video-overlay="src: #strangeFruitVideo"
            material="color: #ffffff; transparent: true; opacity: 0.1; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 0.9; height: 0.2; radius: 0.05">
            <a-text value="Strange Fruit" color="white" scale="0.35 0.35 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>
    </a-entity>
    <!-- Camera and sky -->
    <a-camera id="cam"  wasd-controls="enabled: false" look-controls cursor="rayOrigin: mouse;" raycaster="objects: .interactable; far: 20">
    </a-camera>
    <a-sky id="skybox" src="#sky" rotation="0 -90 0"></a-sky>
</a-scene>
</body>
</html>
