<html>
<head>
    <meta charset="utf-8">
    <title>Smascherati! - Mostra Virtuale</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Montefalco Palazzo Comune Piazza" name="keywords">
    <meta content="Palazzo del Comune e Piazza" name="description">
    <script src="../dist/aframe-min.js"></script>
    <script src="../dist/look-at.js"></script>
    <script src="../assets/scripts/components.js"></script>
    <script src="../assets/scripts/main.js"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    
</head>
<body>
    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
</div>
<!-- A-Frame Scene -->
<a-scene cursor="rayOrigin: mouse;" raycaster="objects: .interactable" inspector>
    <!-- Assets -->
    <a-assets>
        <img id="sky" src="R0010199.jpg">
        <img id="room2" src="../room2/R0010193.jpg">
        <img id="room7" src="../room7/R0010200.jpg">
        <!-- strange fruit -->
        <img id="strangeFruit" src="../assets/images/03_1997_strangeFruit.jpg">
        <video id="strangeFruitVideo" src="/toccSma/Carriola Strange Fruit.mp4" preload="auto" loop></video>
        <!-- hei guis -->
        <img id="heiGuis" src="../assets/images/31_2022_stormyWeather.jpg">
        <video id="heiGuisVideo" src="/toccSma/Valigie Hey Guis.mp4" preload="auto" loop></video>
        <!-- dispersi -->
        <img id="dispersi" src="../assets/images/29_2020_dispersi.jpg">
        <video id="dispersiVideo" src="/toccSma/Finestre Dispersi.mp4" preload="auto" loop></video>
        <!-- senza dove -->
        <img id="senzaDove" src="../assets/images/24_2016_senzaDove.jpg">
        <video id="senzaDoveVideo" src="/toccSma/Copertoni Senzadove Torri.mp4" preload="auto" loop></video>
        <!-- break -->
        <img id="break" src="../assets/images/17_2009_break.jpg">
        <video id="break" src="/toccSma/Tubi Rossi Break.mp4" preload="auto" loop></video>
        <!-- strange angels -->
        <img id="strangeAngels" src="../assets/images/04_1998_strangeAngels.jpg">
        <video id="strangeAngelsVideo" src="/toccSma/Bidone Strange Angels.mp4" preload="auto" loop></video>
        <!-- barbari -->
        <img id="barbari" src="../assets/images/05_1999_barbari.jpg">
        <video id="barbariVideo" src="/toccSma/Secchio Barbari.mp4" preload="auto" loop></video>
        <!-- nell'opaco -->
        <img id="nellOpaco" src="../assets/images/30_2021_nellOpaco.jpg">
        <video id="nellOpacoVideo" src="/toccSma/Gabbione Nell'opaco.mp4" preload="auto" loop></video>
    </a-assets>
    <!-- Portals and hotspots -->
    <a-entity id="hotspots">
        <!-- Portals -->
        <a-link class="interactable" href="../room2/index.html" title="Prosegui" image="#room2" position="-8.786 1.32307 2.10657" rotation="0 -91.931 0" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle; segments: 64" material="backgroundColor: #d7f8fe; shader: portal; side: double; pano: http://127.0.0.1:5500/map/aframe/room2/R0010193.jpg"></a-link>
        <a-link class="interactable" href="../room7/index.html" title="Prosegui7" image="#room7" position="-0.39872 2.05776 6.21814" rotation="-3.8961130068895984 169.29012085391895 -0.27559269945792597" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle; segments: 64" material="backgroundColor: #d7f8fe; shader: portal; side: double; pano: http://127.0.0.1:5500/map/aframe/room7/R0010200.jpg"><a-entity text="color: white; align: center; font: kelsonsans; value: Prosegui7; width: 5" position="0 1.5 0" rotation=""></a-entity></a-link>
        
        <!-- Info Panel-->
        <!-- <a-circle id="F492AP01S01S00" class="interactable" src="#infopanel" radius="0.1" position="-2.5 3 -3" look-at="#cam" show-info="href: info/index.html"></a-circle> -->
        <!-- Hotspots --> 
        <a-circle id="strangeFruiteBtn" class="interactable" src="#strangeFruit" radius="0.4" position="-4.76724 2.09807 5.0757" look-at="#cam" video-overlay="src: #strangeFruitVideo" material="" geometry="" rotation="4.091203075581452 136.7949590221251 0">
            <a-text value="Strange Fruit" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="heiGuisBtn" class="interactable" src="#heiGuis" radius="0.4" position="-7.3081 2.51885 -2.51756" look-at="#cam" video-overlay="src: #heiGuisVideo" material="" geometry="" rotation="6.779192788115036 70.99173416884281 8.007370704000961e-16">
            <a-text value="Hei Guys!" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="dispersiBtn" class="interactable" src="#dispersi" radius="0.4" position="5.09861 0.34834 -0.78999" look-at="#cam" video-overlay="src: #dispersiVideo" material="" geometry="" rotation="-13.636272953865449 -81.19249939917212 8.182022019315503e-16">
            <a-text value="Dispersi" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="senzaDoveBtn" class="interactable" src="#senzaDove" radius="0.4" position="-2.29884 1.39018 -3.77483" look-at="#cam" video-overlay="src: #senzaDoveVideo" material="" geometry="">
            <a-text value="Senza Dove" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="breakBtn" class="interactable" src="#break" radius="0.4" position="-0.97771 2.53989 -4.61819" look-at="#cam" video-overlay="src: #break" material="" geometry="">
            <a-text value="Break" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="strangeAngelsBtn" class="interactable" src="#strangeAngels" radius="0.4" position="-0.12534 1.26478 -5.32709" look-at="#cam" video-overlay="src: #strangeAngelsVideo" material="" geometry="">
            <a-text value="Strange Angels" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="barbariBtn" class="interactable" src="#barbari" radius="0.4" position="1.10112 0.82296 -5.44191" look-at="#cam" video-overlay="src: #barbariVideo" material="" geometry="">
            <a-text value="Barbari" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="nellOpacoBtn" class="interactable" src="#nellOpaco" radius="0.4" position="1.89039 2.70551 -6.22958" look-at="#cam" video-overlay="src: #nellOpacoVideo" material="" geometry="">
            <a-text value="Nell'opaco" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
    </a-entity>
    <!-- Camera and sky -->
    <a-camera id="cam"  wasd-controls="enabled: false" look-controls cursor="rayOrigin: mouse;" raycaster="objects: .interactable; far: 20">
    </a-camera>
    <a-sky id="skybox" src="#sky" rotation="0 -90 0"></a-sky>
</a-scene>
</body>
</html>
