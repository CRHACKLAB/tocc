<html>

    <meta charset="utf-8">
    <title>Smascherati! - Mostra Virtuale</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Montefalco Palazzo Comune Piazza" name="keywords">

<body>
    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
    
    <!-- <div>
        <button id="playPauseBtn"><i class="fa-solid fa-play"></i>/<i class="fa-solid fa-pause"></i></button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
    </div> -->
</div>
<!-- A-Frame Scene -->
<a-scene cursor="rayOrigin: mouse;" raycaster="objects: .interactive" inspector>

    <!-- Portals and hotspots -->
    <a-entity id="hotspots">
        <!-- Portals -->
        <a-circle class="interactable" 
            portal-link="href: ../room5/index.html"
            position="7.46776 2.21898 1.97396" 
            rotation="3.1042853340188 -121.03446943241075 90" 
            scale="0.80887 0.80887 0.80887" 
            radius="1"
            material="color: #ffffff; transparent: true; opacity: 0.2; shader: flat; side: double">
            
            <!-- Freccia costruita con forme geometriche -->
            <!-- Asta della freccia -->
            <a-box width="0.6" 
                height="0.1" 
                depth="0.05" 
                color="white" 
                position="0 0 0.1">
            </a-box>
            
            <!-- Punta della freccia (triangolo) -->
            <a-cone radius-bottom="0.2" 
                radius-top="0" 
                height="0.3" 
                color="white" 
                rotation="0 0 -90" 
                position="0.4 0 0.1">
            </a-cone>

            <!-- Bordo del cerchio -->
            <a-ring color="white" 
                radius-inner="0.97" 
                radius-outer="1" 
                segments-theta="64" 
                material="side: double">
            </a-ring>
        </a-circle>

        <a-circle class="interactable" 
            portal-link="href: ../room3/index.html"
            position="-8.49067 2.49675 0.87588" 
            rotation="3.955700617583204 81.31417028496644 90" 
            scale="0.80887 0.80887 0.80887" 
            radius="1"
            material="color: #ffffff; transparent: true; opacity: 0.2; shader: flat; side: double">
            
            <!-- Freccia costruita con forme geometriche -->

                color="white" 
                position="0 0 0.1">
            </a-box>
            
            <!-- Punta della freccia (triangolo) -->
            <a-cone radius-bottom="0.2" 
                radius-top="0" 
                height="0.3" 
                color="white" 
                rotation="0 0 -90"

            <!-- Bordo del cerchio -->
            <a-ring color="white" 
                radius-inner="0.97" 
                radius-outer="1" 
                segments-theta="64" 
                material="side: double">
            </a-ring>
        </a-circle>
        
        <!-- Hotspots --> 
        <a-circle id="strangeFruitBtn" class="interactable" src="#strangeFruit" radius="0.4" position="-3.60685 0.68871 0.37242" look-at="#cam" video-overlay="src: #strangeFruitVideo" material="opacity: 0; transparent: true" geometry="" rotation="-14.107360989400929 95.89510100623858 -8.198652240694706e-16">
            <a-text value="Strange Fruit" color="white" scale="0.8 0.8 1" position="" align="center" text=""></a-text>

    <a-camera id="cam"  wasd-controls="enabled: false" look-controls cursor="rayOrigin: mouse;" raycaster="objects: .interactable; far: 20">

    <a-sky id="skybox" src="#sky" rotation="0 -90 0"></a-sky>
