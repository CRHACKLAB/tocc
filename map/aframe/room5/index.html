    <div id="slides" class="hidden">

    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>

                depth="0.05"

                height="0.3" 
                color="white" 
                rotation="0 0 -90" 
                position="0.4 0 0.1">

                radius-inner="0.97" 
                radius-outer="1" 
                segments-theta="64"
