<html>
<head>
    <meta charset="utf-8">
    <title>Smascherati! - Mostra Virtuale</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Montefalco Palazzo Comune Piazza" name="keywords">
    <meta content="Palazzo del Comune e Piazza" name="description">
    <script src="../dist/aframe-min.js"></script>
    <script src="../dist/look-at.js"></script>
    <script src="../assets/scripts/components.js"></script>
    <script src="../assets/scripts/main.js"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    
</head>
<body>
    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
    
    <!-- <div>
        <button id="playPauseBtn"><i class="fa-solid fa-play"></i>/<i class="fa-solid fa-pause"></i></button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
    </div> -->
</div>
<!-- A-Frame Scene -->
<a-scene cursor="rayOrigin: mouse;" raycaster="objects: .interactive" inspector>
    <!-- Assets -->
    <a-assets>
        <img id="sky" src="R0010197.jpg">
        <img id="linkpreview01" src="../S02/F492AP01S02.jpg">
        <img id="room1" src="../room1/R0010191.jpg">
        <img id="room8" src="../room8/R0010202.jpg">
        <!-- end bag -->
        <img id="endBag" src="../assets/images/24_2016_senzaDove.jpg">
        <video id="endBagVideo" src="/toccSma/Valigie End Bag.mp4" preload="auto" loop></video>
        <!-- papiers -->
        <img id="papier" src="../assets/images/15_2007_papiers.jpg">
        <video id="papierVideo" src="/toccSma/Bancale Papier.mp4" preload="auto" loop></video>
        <!-- dal gorgo -->
        <img id="dalGorgo" src="../assets/images/07_2001_dalGorgo.jpg">
        <video id="dalGorgoVideo" src="/toccSma/Acquario Dal Gorgo.mp4" preload="auto" loop></video>
        <!-- il cielo è muto -->
        <img id="cieloMuto" src="../assets/images/33_2024_ilCieloMuto.jpg">
        <video id="cieloMutoVideo" src="/toccSma/Coperte Il Cielo È Muto.mp4" preload="auto" loop></video>
        <!-- via di qua -->
        <img id="viaDiQua" src="../assets/images/27_2018_viaDiQua.jpg">
        <video id="viaDiQuaVideo" src="/toccSma/Cavallino-Via Di Qua.mp4" preload="auto" loop></video>
        <!-- babel -->
        <img id="babel" src="../assets/images/23_2015_babel.jpg">
        <video id="babelVideo" src="/toccSma/Scala Babel.mp4" preload="auto" loop></video>
    </a-assets>
    <!-- Portals and hotspots -->
    <a-entity id="hotspots">
        <!-- Portals -->
        <a-link class="interactable" href="../room8/index.html" title="Prosegui" image="#room8" position="4.46911 2.21898 -6.11983" rotation="3.1042853340188 -51.466506905421326 1.1069544601927506" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle; segments: 64" material="backgroundColor: #d7f8fe; shader: portal; side: double; pano: http://127.0.0.1:5500/map/aframe/room8/R0010202.jpg"></a-link>
        <a-link class="interactable" href="../room1/index.html" title="Prosegui" image="#room1" position="-5.59284 1.52202 -3.84971" rotation="2.2614644173813594 59.36702194248024 1.61459506667866" scale="0.80887 0.80887 0.80887" link="backgroundColor: #d7f8fe" geometry="primitive: circle; segments: 64" material="backgroundColor: #d7f8fe; shader: portal; side: double; pano: http://127.0.0.1:5500/map/aframe/room1/R0010191.jpg"></a-link>
        
        <!-- Hotspots --> 
        <a-circle id="endBagBtn" class="interactable" src="#endBag" radius="0.4" position="-0.03427 0.66125 6.13887" look-at="#cam" video-overlay="src: #endBagVideo" material="" geometry="" rotation="-8.69412915941923 179.6801518899618 3.142115281821887e-18">
            <a-text value="End Bag" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="cieloMutoBtn" class="interactable" src="#cieloMuto" radius="0.4" position="-4.8391 -0.01108 2.8187" look-at="#cam" video-overlay="src: #cieloMutoVideo" material="" geometry="">
            <a-text value="Il Cielo e' Muto" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="papierBtn" class="interactable" src="#papier" radius="0.4" position="4.30964 -0.47636 0.17017" look-at="#cam" video-overlay="src: #papierVideo" material="" geometry="" rotation="-25.707054498901915 -92.2612005482506 3.5299348528972444e-15">
            <a-text value="Papiers" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="viaDiQuaBtn" class="interactable" src="#viaDiQua" radius="0.4" position="1.76329 1.03993 -7.0499" look-at="#cam" video-overlay="src: #viaDiQuaVideo" material="" geometry="">
            <a-text value="Via di Qua" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="babelBtn" class="interactable" src="#babel" radius="0.4" position="-6.92839 1.96147 1.94663" look-at="#cam" video-overlay="src: #babelVideo" material="" geometry="">
            <a-text value="Babel" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
        <a-circle id="dalGorgo" class="interactable" src="#dalGorgo" radius="0.4" position="4.62422 0.77851 -1.42619" look-at="#cam" video-overlay="src: #dalGorgoVideo" material="" geometry="">
            <a-text value="Dal Gorgo" color="white" scale="0.8 0.8 1" position="0 0.5 0" align="center" text=""></a-text>
        </a-circle>
    </a-entity>
    <!-- Camera and sky -->
    <a-camera id="cam"  wasd-controls="enabled: false" look-controls cursor="rayOrigin: mouse;" raycaster="objects: .interactable; far: 20">
    </a-camera>
    <a-sky id="skybox" src="#sky" rotation="0 -90 0"></a-sky>
</a-scene>
</body>
</html>
