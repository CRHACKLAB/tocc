<html>
<head>
    <meta charset="utf-8">
    <title>Smascherati! - Mostra Virtuale</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Montefalco Palazzo Comune Piazza" name="keywords">
    <meta content="Palazzo del Comune e Piazza" name="description">
    <script src="../dist/aframe-min.js"></script>
    <script src="../dist/look-at.js"></script>
    <script src="../assets/scripts/components.js"></script>
    <script src="../assets/scripts/main.js"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
    <!-- Fontawesome cdn -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->
    
</head>
<body>
    <!------>
    <div id="slides" class="hidden">
        <div class="inner" >
            <div id="slide" style="background: url('F492AP01S01H01.jpg') 0 0; background-repeat: no-repeat; 	background-size: cover;">
                <img id="closebut" src="../assets/images/close.png"  onclick="closeSlides()">
                <img id="previousbut" src="../assets/images/previous.png"  onclick="previousSlide()">
                <img id="nextbut" src="../assets/images/next.png"  onclick="nextSlide()">
            </div>
        </div>
    </div>
    <!-- overlay video fullscreen -->
    <div id="videoOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1rem;
    ">
    <div style="position: absolute; top: 1rem; right: 1rem;">
        <button id="closeVideoBtn" style="font-size:1.5rem;">✕</button>
    </div>
    
    <video id="overlayVideo" style="max-width: 90vw; max-height: 70vh;" controls></video>
    
    <!-- <div>
        <button id="playPauseBtn"><i class="fa-solid fa-play"></i>/<i class="fa-solid fa-pause"></i></button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1">
    </div> -->
</div>

<!-- entrance link -->
<!-- Link fisso in basso a destra -->
<div id="entranceLink" 
    class="entranceLink"
    style="
    position: fixed;
    bottom: 1rem;
    left: 1rem;
    z-index: 1000;
    cursor: pointer;
    background: rgba(0, 0, 0, 0.4);
    padding: 1rem 2rem;
    border-radius: 8px;
    transition: all 0.3s ease;
    ">
    <a href="../entrance/index.html" style="
    color: white;
    text-decoration: none;
    font-size: 1.2rem;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    ">Visita la mostra</a>
</div>

<!-- A-Frame Scene -->
<a-scene cursor="rayOrigin: mouse;" raycaster="objects: .interactable" inspector>
    <!-- Assets -->
    <a-assets>
        <img id="sky" src="R0010196.jpg">
        <img id="room7" src="../room7/R0010200.jpg">
        <img id="entrance" src="../entrance/tempo_equirettangolare.png">
        <!-- rumble -->
        <img id="rumble" src="../assets/images/10_2003_rumble.jpg">
        <video id="rumbleVideo" src="/toccSma/Fila Sedie Teatro Rumble.mp4" preload="auto" loop></video>
        <!-- dispersi -->
        <img id="dispersi" src="../assets/images/29_2020_dispersi.jpg">
        <video id="dispersiVideo" src="/toccSma/Finestre Dispersi.mp4" preload="auto" loop></video>
        <!-- brand -->
        <img id="brand" src="../assets/images/25_2016_brand.jpg">
        <video id="brandVideo" src="/toccSma/Tappeto Brand.mp4" preload="auto" loop></video>
        <!-- enpassant -->
        <img id="enpassant" src="../assets/images//08_2001_enPassant.jpg">
        <video id="enpassantVideo" src="/toccSma/Scarpe En passant... (2001).mp4" preload="auto" loop></video>
        <!-- nubi -->
        <img id="nubi" src="../assets/images/28_2019_nubi.jpg">
        <video id="nubiVideo" src="/toccSma/NuvoleNubi.mp4" preload="auto" loop></video>
        <!-- oh gregor -->
        <img id="ohGregor" src="../assets/images/26_2017_ohGregor.jpg">
        <video id="ohGregorVideo" src="/toccSma/Portale Panche Oh Gregor!.mp4" preload="auto" loop></video>
    </a-assets>
    <!-- Portals and hotspots -->
    <a-entity id="hotspots">
        <!-- Portals -->
        
        <a-circle class="interactable" 
            portal-link="href: ../room7/index.html"
            position="-7.23753 2.13367 1.4559" 
            rotation="3.5701000214601595 87.91579000046377 -1.7526778953051882" 
            scale="0.80887 0.80887 0.80887" 
            radius="1"
            material="color: #ffffff; transparent: true; opacity: 0.2; shader: flat; side: double">
            
            <!-- Freccia costruita con forme geometriche -->
            <!-- Asta della freccia -->
            <a-box width="0.6" 
                height="0.1" 
                depth="0.05" 
                color="white" 
                position="0 0 0.1">
            </a-box>
            
            <!-- Punta della freccia (triangolo) -->
            <a-cone radius-bottom="0.2" 
                radius-top="0" 
                height="0.3" 
                color="white" 
                rotation="0 0 -90" 
                position="0.4 0 0.1">
            </a-cone>

            <!-- Bordo del cerchio -->
            <a-ring color="white" 
                radius-inner="0.97" 
                radius-outer="1" 
                segments-theta="64" 
                material="side: double">
            </a-ring>
        </a-circle>

<!-- Info Panel-->
<!-- <a-circle id="F492AP01S01S00" class="interactable" src="#infopanel" radius="0.1" position="-2.5 3 -3" look-at="#cam" show-info="href: info/index.html"></a-circle> -->
<!-- Hotspots -->

    <a-text  value="Info su Piazza" color="white" scale="0.3 0.3 1" position="0 0.2 0" align="center"></a-text>
</a-circle> -->
        <a-plane 
            id="rumbleBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="0.913 1.780 1.542" 
            look-at="#cam" 
            video-overlay="src: #rumbleVideo"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.0; height: 0.4; radius: 0.08">
            <a-text value="Rumble" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="dispersiBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="-0.906 0.976 -1.496" 
            look-at="#cam" 
            video-overlay="src: #dispersiVideo"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.0; height: 0.4; radius: 0.08">
            <a-text value="Dispersi" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="brandBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="2.186 0.221 -1.760" 
            look-at="#cam" 
            video-overlay="src: #brandVideo"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.0; height: 0.4; radius: 0.08">
            <a-text value="Brand" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="enpassantBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="1.665 1.140 -1.162"
            rotation="-4.482 -55.551 90"
            video-overlay="src: #enpassantVideo"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.2; height: 0.4; radius: 0.08">
            <a-text value="En Passant" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="nubiBtn" 
            class="interactable" 
            width="0.5" 
            height="0.2" 
            position="2.452 1.556 -1.435" 
            look-at="#cam" 
            video-overlay="src: #nubiVideo"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.0; height: 0.4; radius: 0.08">
            <a-text value="Nubi" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="ohGregorBtn" 
            class="interactable" 
            width="0.7" 
            height="0.2" 
            position="2.049 1.565 -0.853" 
            rotation="0 -76.782 90"
            video-overlay="src: #ohGregorVideo"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.3; height: 0.4; radius: 0.08">
            <a-text value="Oh Gregor!" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>

        <a-plane 
            id="nellOpacoBtn" 
            class="interactable" 
            width="0.6" 
            height="0.2" 
            position="1.849 1.468 -1.807" 
            look-at="#cam"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat; side: double"
            button-hover="normalColor: #ffffff; hoverColor: #FFD700"
            rounded-rectangle="width: 1.2; height: 0.4; radius: 0.08">
            <a-text value="Nell'opaco" color="white" scale="0.5 0.5 1" position="0 0 0.01" align="center" shader="flat"></a-text>
        </a-plane>
    </a-entity>
<!-- Plane for video texture display -->
<!-- Camera and sky -->
<a-camera id="cam"  wasd-controls="enabled: false" look-controls cursor="rayOrigin: mouse;" raycaster="objects: .interactable; far: 20">
</a-camera>
<a-sky id="skybox" src="#sky" rotation="0 90 0"></a-sky>
</a-scene>
</body>
</html>
