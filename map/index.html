<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>L'Umbria in Classe - Fondazione Sant'Anna</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/img/logosanna.png" type="image/svg+xml">
    <!-- css -->
    <link rel="stylesheet" href="./assets/css/normalize.css" media="screen">
    <link rel="stylesheet" href="./assets/css/main.css" media="screen"> 
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
    rel="stylesheet"
    />
</head>

<body>
    <div class="container">
        <div id="info-card-layer" class="layer info-card" hidden>

        </div>
        <div id="sidebar" class="layer sidebar" hidden>
            <div class='heading'>
                <div class="logo">
                    <img class="logo-img" src="./assets/img/logosanna.png" alt="Logo del progetto">
                </div>
                <select id="filter-dropdown">
                    
                </select>
            </div>
            <div id="listings" class="listings"></div>
            
            
        </div>
        <div id="map" class="layer map">
            <button type="button" id="filter-marker" class="filter-button sidebarbtn"><i class="fa-solid fa-sliders" ></i>
                <select id="marker-dropdown" class="marker-dropdown" onchange="applyFilters()">
                    
                </select> 
            </button> 
        </div>
    </div>
    
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/map-perugia-it.js"></script>
